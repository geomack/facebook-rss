name: Build Facebook and Telegram RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages.json'
      - 'check_facebook.py'
      - 'rss_monitor.py'
      - 'telegram_collector.py'
      - 'telegram.json'
      - '.github/workflows/rss.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: facebook-rss-feed-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check collector syntax
        run: python -m py_compile check_facebook.py rss_monitor.py telegram_collector.py

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Telegram HTML parser
        run: python -m pip install beautifulsoup4

      - name: Collect pages and build RSS
        run: python -u rss_monitor.py

      - name: Validate RSS
        run: |
          test -s docs/feed.xml
          test -s docs/feed-test.xml
          test -s docs/telegram.xml
          python -c "import xml.etree.ElementTree as E; files=['docs/feed.xml','docs/feed-test.xml','docs/telegram.xml']; [(lambda r: print(p, len(r.findall('./channel/item')), 'items', r.findtext('./channel/title')))(E.parse(p).getroot()) for p in files]"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-rss-diagnostics
          path: |
            results/facebook_browser_test.json
            results/telegram_posts.json
            docs/feed.xml
            docs/feed-test.xml
            docs/telegram.xml
          if-no-files-found: ignore

      - name: Commit feed and seen posts
        run: |
          git config pull.rebase true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/feed-test.xml docs/telegram.xml state/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Facebook and Telegram RSS"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          else
            echo "No feed changes"
          fi
