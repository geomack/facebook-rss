name: Build Facebook RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages.json'
      - 'check_facebook.py'
      - 'rss_monitor.py'
      - '.github/workflows/rss.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: facebook-rss-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collect pages and build RSS
        run: python -u rss_monitor.py

      - name: Validate RSS
        run: |
          test -s docs/feed.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('docs/feed.xml').getroot(); assert r.tag=='rss'; print('RSS XML valid, items:',len(r.findall('./channel/item')))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-rss-diagnostics
          path: |
            results/facebook_browser_test.json
            docs/feed.xml
          if-no-files-found: ignore

      - name: Commit feed and seen posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml state/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Facebook RSS"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No feed changes"
          fi
