name: Build Facebook and Telegram RSS

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action
        type: choice
        options: [refresh, add, remove]
        default: refresh
      feed:
        description: Feed
        type: choice
        options: [telegram, facebook]
        default: telegram
      source:
        description: Public Telegram @username or link, or Facebook page URL
        type: string
      name:
        description: Display name for a new source (optional)
        type: string
  push:
    branches: [main]
    paths:
      - 'pages.json'
      - 'check_facebook.py'
      - 'rss_monitor.py'
      - 'telegram_collector.py'
      - 'telegram.json'
      - 'manage_sources.py'
      - '.github/workflows/rss.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: facebook-rss-feed-v2
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source change
        if: github.event_name == 'workflow_dispatch' && inputs.action != 'refresh'
        env:
          SOURCE_FEED: ${{ inputs.feed }}
          SOURCE_ACTION: ${{ inputs.action }}
          SOURCE_VALUE: ${{ inputs.source }}
          SOURCE_NAME: ${{ inputs.name }}
        run: python manage_sources.py "$SOURCE_FEED" "$SOURCE_ACTION" "$SOURCE_VALUE" --name="$SOURCE_NAME"

      - name: Check collector syntax
        run: python -m py_compile check_facebook.py rss_monitor.py telegram_collector.py manage_sources.py

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Telegram HTML parser
        run: python -m pip install beautifulsoup4

      - name: Collect pages and build RSS
        run: python -u rss_monitor.py

      - name: Validate RSS
        run: |
          test -s docs/feed.xml
          test -s docs/feed-test.xml
          test -s docs/telegram.xml
          python -c "import xml.etree.ElementTree as E; files=['docs/feed.xml','docs/feed-test.xml','docs/telegram.xml']; [(lambda r: print(p, len(r.findall('./channel/item')), 'items', r.findtext('./channel/title')))(E.parse(p).getroot()) for p in files]"

      - name: Report source health
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("docs/sources.json")
          if not report.exists():
              print("::warning::RSS source health report was not produced")
              raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8"))
          lines = ["### RSS source health", "", "| Feed | Source | New posts this run | Saved posts | Status |",
                   "|---|---|---:|---:|---|"]
          for source in data.get("sources", []):
              if not source.get("enabled", True):
                  continue
              error = source.get("error")
              status = "ERROR: " + error if error else "OK"
              lines.append("| {} | {} | {} | {} | {} |".format(
                  source.get("feed", ""), source.get("name", "").replace("|", "/"),
                  source.get("new", 0), source.get("in_feed", 0), status))
              if error:
                  print("::warning title=RSS source unavailable::{}: {}. Older posts retained.".format(
                      source.get("name", "Unknown"), error))
              elif source.get("selected", 0) == 0 and source.get("feed") == "facebook":
                  print("::warning title=Facebook source empty::{}: No new public posts were extracted; older posts retained.".format(
                      source.get("name", "Unknown")))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
                  file.write("\\n".join(lines) + "\\n")
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-rss-diagnostics
          path: |
            results/facebook_browser_test.json
            results/telegram_posts.json
            docs/feed.xml
            docs/feed-test.xml
            docs/telegram.xml
            docs/sources.json
          if-no-files-found: ignore

      - name: Commit feed and seen posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages.json telegram.json docs/feed.xml docs/feed-test.xml docs/telegram.xml docs/sources.json state/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Facebook and Telegram RSS"
            git push origin HEAD:main
          else
            echo "No feed changes"
          fi
