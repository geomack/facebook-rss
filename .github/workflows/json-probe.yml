name: Inspect public post JSON
on:
  workflow_dispatch:
  push:
    paths:
      - 'json_probe.py'
      - '.github/workflows/json-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect embedded JSON for post candidates
        run: python -u json_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-json-probe
          path: results/json_probe.json
          if-no-files-found: ignore
