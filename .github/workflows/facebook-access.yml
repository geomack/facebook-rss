name: Compare public Facebook access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/facebook-access.yml']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compare profiles and Posts routes
        run: |
          python -u - <<'PY'
          import json
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          from check_facebook import page_access, dismiss_initial_login_prompt

          profiles = ("reteller", "peter.chernyshov")
          targets = [(profile, suffix) for profile in profiles for suffix in ("", "/posts")]
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              for round_number, order in enumerate((targets, list(reversed(targets))), 1):
                  for profile, suffix in order:
                      target = "https://www.facebook.com/" + profile + suffix
                      with browser.new_context(locale="en-US", viewport={"width": 1365, "height": 900}) as context:
                          page = context.new_page()
                          row = {"round": round_number, "target": target}
                          try:
                              response = page.goto(target, wait_until="domcontentloaded", timeout=25000)
                              page.wait_for_timeout(3500)
                              dismiss_initial_login_prompt(page)
                              body = page.locator("body").inner_text(timeout=10000)
                              final_url = urlsplit(page.url)
                              row.update(status=response.status if response else None,
                                         destination=final_url.netloc + final_url.path,
                                         access=page_access(page, body),
                                         articles=page.locator('[role="article"]').count())
                          except Exception as exc:
                              row["error"] = type(exc).__name__
                          print("FACEBOOK_PROBE", json.dumps(row), flush=True)
              browser.close()
          PY
