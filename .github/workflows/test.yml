
name: Test Facebook public posts

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check Facebook pages
        run: python -u -c "import check_facebook; check_facebook.main()"

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-browser-test
          path: results/facebook_browser_test.json
          if-no-files-found: ignore
