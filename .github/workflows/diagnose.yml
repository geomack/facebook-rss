name: Diagnose Facebook HTML and network

on:
  workflow_dispatch:
  push:
    paths:
      - 'source_diagnostic.py'
      - '.github/workflows/diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public HTML and network metadata
        run: python -u source_diagnostic.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-diagnostic
          path: results/source_diagnostic.json
          if-no-files-found: ignore
