name: Reteller isolated diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reteller_lab.py'
      - '.github/workflows/reteller-lab.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate and run isolated test
        run: |
          python -m py_compile reteller_lab.py
          python -u reteller_lab.py --scrolls 5
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reteller-lab-anonymous
          path: results/reteller_lab.json
          if-no-files-found: warn
